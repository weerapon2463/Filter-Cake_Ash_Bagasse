<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จัดการคำขอสิ่งปฏิกูล</title>
<meta name="description" content="หน้าเจ้าหน้าที่: หัวหน้าเขตและแผนกสิ่งแวดล้อม ตรวจเอกสาร และปิดคำขอเมื่อเอกสารผ่าน">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20260929s">
</head>
<body>
<header class="top"><div class="wrap">
  <img class="logo" src="assets/logo.png" alt="น้ำตาลพิษณุโลก">
  <div><h1>จัดการคำขอสิ่งปฏิกูล<small data-who>เจ้าหน้าที่</small></h1></div>
  <div class="sp"></div>
  <a class="btn small" href="index.html">หน้าผู้ขอ</a>
  <button class="btn small" id="logout" hidden>ออกจากระบบ</button>
</div></header>

<main class="wrap">
  <section id="login" class="card login">
    <h3>เข้าสู่ระบบเจ้าหน้าที่</h3>
    <form id="loginForm">
      <label>รหัส PIN 6 หลัก<input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required></label>
      <div class="actions"><button class="btn primary">เข้าสู่ระบบ</button></div>
    </form>
    <p class="hint">PIN ได้จากแผนกสิ่งแวดล้อม (หัวหน้าเขตแต่ละเขตมี PIN ของตัวเอง)</p>
    <p class="hint" data-demo-hint hidden>โหมดทดลอง: แผนกสิ่งแวดล้อม <b>000000</b> · หัวหน้าเขต 1 <b>111111</b> · หัวหน้าเขต 5 <b>555555</b></p>
    <p data-demo-link hidden><a class="btn small" href="staff.html?demo=1">ลองใช้โหมดทดลอง (ไม่ใช้ข้อมูลจริง)</a></p>
  </section>

  <section id="app" hidden>
    <div class="stats" data-stats></div>
    <div class="toolbar">
      <label class="grow">ค้นหา<input id="q" placeholder="ชื่อ / เลขที่คำขอ / เบอร์ / เลขบัตร"></label>
      <label data-zone-filter>เขต<select id="fZone"><option value="">ทุกเขต</option></select></label>
      <label>ชนิด<select id="fProduct"><option value="">ทุกชนิด</option></select></label>
      <button class="btn" id="reload" title="โหลดใหม่">↻</button>
      <button class="btn primary" id="addNew">+ คีย์คำขอแทนชาวไร่</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th><input type="checkbox" id="checkAll" aria-label="เลือกทั้งหมด"></th>
          <th>เลขที่</th><th>ชื่อ-นามสกุล</th><th>เขต</th><th>ชนิด</th><th style="text-align:right">ไร่</th><th style="text-align:right">ตัน</th><th>เอกสาร</th><th>สถานะ</th>
        </tr></thead>
        <tbody data-rows></tbody>
      </table>
    </div>
    <p class="hint" data-summary></p>
    <div class="bulkbar" data-bulk hidden></div>
  </section>
</main>
<footer id="footer"></footer>

<dialog id="dlg"><div class="dhead"><b data-title></b><button class="btn small ghost" data-close aria-label="ปิด">✕</button></div><div class="dbody" data-body></div></dialog>
<div id="print"></div>

<script src="assets/config.js?v=20260929s"></script>
<script src="assets/logic.js?v=20260929s"></script>
<script src="assets/app.js?v=20260929s"></script>
<script>
(function () {
  const { CFG, STATUS, STAFF_CHECKS, OWNERSHIP, $, $$, esc, fmtNum, fmtDate, num, productName, statusBadge, stepper, toast, api, docsFor, readFileForUpload } = FC;
  FC.footer();
  if (FC.DEMO) $('[data-demo-hint]').hidden = false; else $('[data-demo-link]').hidden = false;

  let me = null, rows = [], filter = { status: '', q: '', zone: '', product: '' }, selected = new Set();
  const dlg = $('#dlg');
  $('[data-close]', dlg).onclick = () => dlg.close();
  function openDlg(title, html) { $('[data-title]', dlg).textContent = title; $('[data-body]', dlg).innerHTML = html; if (!dlg.open) dlg.showModal(); return $('[data-body]', dlg); }

  // ---------- login ----------
  const SKEY = FC.DEMO ? 'fc-staff-demo' : 'fc-staff';
  try { const s = JSON.parse(sessionStorage.getItem(SKEY)); if (s) start(s); } catch {}
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const pin = e.target.pin.value.replace(/\D/g, '');
    const btn = $('button', e.target);
    btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ…';
    const slow = setTimeout(() => (btn.textContent = 'กำลังเชื่อมต่อเซิร์ฟเวอร์ (ครั้งแรกอาจใช้ ~10 วินาที)…'), 3000);
    try { const { user } = await api('login', { pin }); user.pin = pin; start(user); }
    catch (x) { toast(x.message, true); }
    finally { clearTimeout(slow); btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ'; }
  });
  $('#logout').onclick = () => { try { sessionStorage.removeItem(SKEY); } catch {} location.reload(); };

  function start(u) {
    me = u;
    try { sessionStorage.setItem(SKEY, JSON.stringify(u)); } catch {}
    $('#login').hidden = true; $('#app').hidden = false; $('#logout').hidden = false;
    $('[data-who]').textContent = u.name + (u.role === 'env' ? ' · แผนกสิ่งแวดล้อม' : ' · เขต ' + u.zone);
    $('[data-zone-filter]').hidden = u.role !== 'env';
    $('#fZone').insertAdjacentHTML('beforeend', CFG.ZONES.map(z => `<option>${esc(z)}</option>`).join(''));
    $('#fProduct').insertAdjacentHTML('beforeend', CFG.PRODUCTS.map(p => `<option value="${p.id}">${esc(p.short)}</option>`).join(''));
    load();
  }
  async function load() {
    if (!rows.length) $('[data-rows]').innerHTML = '<tr><td colspan="9" class="muted" style="text-align:center;padding:30px">กำลังโหลดข้อมูล…</td></tr>';
    try { rows = (await api('list', { pin: me.pin })).rows; render(); }
    catch (x) { toast(x.message, true); if (/เข้าสู่ระบบ/.test(x.message)) $('#logout').click(); }
  }
  $('#reload').onclick = load;
  $('#q').oninput = e => { filter.q = e.target.value.trim().toLowerCase(); render(); };
  $('#fZone').onchange = e => { filter.zone = e.target.value; render(); };
  $('#fProduct').onchange = e => { filter.product = e.target.value; render(); };

  // ---------- ตาราง ----------
  function docsDone(r) { const need = docsFor(r.ownership || 'own'); return need.filter(d => (r.docs[d.id] || []).length).length + '/' + need.length; }
  function visible() {
    return rows.filter(r =>
      (!filter.status || r.status === filter.status) && (!filter.zone || String(r.zone) === filter.zone) &&
      (!filter.product || r.product === filter.product) &&
      (!filter.q || [r.id, r.name, r.phone, r.landLocation, r.citizenId].join(' ').toLowerCase().includes(filter.q))
    ).sort((a, b) => String(b.updated).localeCompare(String(a.updated)));
  }
  function render() {
    const base = rows.filter(r => (!filter.zone || String(r.zone) === filter.zone) && (!filter.product || r.product === filter.product));
    const count = st => base.filter(r => r.status === st).length;
    const tonsDone = base.filter(r => r.status === 'env_ok').reduce((s, r) => s + num(r.tons), 0);
    $('[data-stats]').innerHTML =
      `<button class="stat ${!filter.status ? 'on' : ''}" data-st=""><b>${base.length}</b><span>ทั้งหมด</span></button>` +
      Object.entries(STATUS).map(([k, s]) => `<button class="stat ${filter.status === k ? 'on' : ''}" data-st="${k}"><b class="tone-${s.tone}">${count(k)}</b><span>${esc(s.short)}</span></button>`).join('') +
      `<div class="stat"><b>${fmtNum(tonsDone)}</b><span>ตัน (เสร็จแล้ว)</span></div>`;
    $$('[data-st]').forEach(b => (b.onclick = () => { filter.status = b.dataset.st; selected.clear(); render(); }));
    const list = visible();
    [...selected].forEach(id => { if (!list.some(r => r.id === id)) selected.delete(id); });
    $('[data-rows]').innerHTML = list.map(r => `<tr data-id="${esc(r.id)}">
      <td><input type="checkbox" data-sel="${esc(r.id)}" ${selected.has(r.id) ? 'checked' : ''} aria-label="เลือก"></td>
      <td><b>${esc(r.id)}</b><br><small class="muted">${fmtDate(r.created)}</small></td>
      <td>${esc(r.name)}<br><small class="muted">${esc(r.phone)}</small></td>
      <td>${esc(r.zone)}</td><td>${esc(productName(r.product))}</td>
      <td style="text-align:right">${fmtNum(r.rai, 2)}</td><td style="text-align:right">${fmtNum(r.tons, 1)}</td>
      <td>${docsDone(r)}</td><td>${statusBadge(r.status)}</td></tr>`).join('') ||
      '<tr><td colspan="9" class="muted" style="text-align:center;padding:30px">ไม่มีรายการ</td></tr>';
    const sumR = list.reduce((s, r) => s + num(r.rai), 0), sumT = list.reduce((s, r) => s + num(r.tons), 0);
    $('[data-summary]').textContent = `แสดง ${list.length} ราย · ${fmtNum(sumR, 2)} ไร่ · ${fmtNum(sumT, 1)} ตัน`;
    $('#checkAll').checked = list.length > 0 && list.every(r => selected.has(r.id));
    drawBulk();
  }
  $('[data-rows]').addEventListener('click', e => {
    const cb = e.target.closest('[data-sel]');
    if (cb) { cb.checked ? selected.add(cb.dataset.sel) : selected.delete(cb.dataset.sel); drawBulk(); return; }
    const tr = e.target.closest('tr[data-id]'); if (tr) openDetail(tr.dataset.id);
  });
  $('#checkAll').onchange = e => { visible().forEach(r => e.target.checked ? selected.add(r.id) : selected.delete(r.id)); render(); };

  // ---------- การทำงานแบบกลุ่ม ----------
  function actionsFor(list) {
    const all = st => list.length && list.every(r => st.includes(r.status));
    const a = [];
    if (me.role === 'zone') {
      if (all(['submitted', 'fix'])) a.push(['zone_ok', 'ส่งแผนกสิ่งแวดล้อม']);
    } else {
      if (all(['submitted', 'zone_ok', 'fix'])) { a.push(['env_ok', 'เอกสารผ่าน → เสร็จ']); a.push(['fix', 'ต้องแก้ไข']); }
      if (all(['env_ok'])) a.push(['fix', 'ย้อนกลับ: ต้องแก้ไข']);
    }
    return a;
  }
  function drawBulk() {
    const bar = $('[data-bulk]');
    const list = rows.filter(r => selected.has(r.id));
    bar.hidden = !list.length;
    if (!list.length) return;
    bar.innerHTML = `<b>เลือก ${list.length} ราย</b>` +
      actionsFor(list).map(([st, lbl]) => `<button class="btn small" data-act="${st}">${esc(lbl)}</button>`).join('') +
      `<button class="btn small" data-print>🖨 ใบปะหน้าเขต</button><button class="btn small" data-csv>⬇ CSV</button><button class="btn small" data-clear>ล้าง</button>`;
    $$('[data-act]', bar).forEach(b => (b.onclick = () => askStatus([...selected], b.dataset.act)));
    $('[data-print]', bar).onclick = () => printCover(list);
    $('[data-csv]', bar).onclick = () => exportCsv(list);
    $('[data-clear]', bar).onclick = () => { selected.clear(); render(); };
  }

  function askStatus(ids, st) {
    const today = new Date().toISOString().slice(0, 10);
    const f = {
      zone_ok: '', env_ok: '',
      fix: '<label>สิ่งที่ต้องแก้ไข *<textarea name="fixReason" rows="3" required placeholder="เช่น สำเนาโฉนดยังไม่รับรองหน้า 2, บัตรชาวไร่หมดอายุ"></textarea></label>',
    }[st] || '';
    const body = openDlg(`${STATUS[st].label} — ${ids.length} ราย`, `<form class="grid2" id="stForm"><div class="span2">${f || 'ยืนยันเปลี่ยนสถานะ'}</div>
      <div class="span2 actions"><button type="button" class="btn ghost" data-x>ยกเลิก</button><button class="btn primary">ยืนยัน</button></div></form>`);
    $('[data-x]', body).onclick = () => dlg.close();
    $('#stForm').addEventListener('submit', async e => {
      e.preventDefault();
      const extra = Object.fromEntries(new FormData(e.target));
      try {
        await api('setStatus', { pin: me.pin, ids, status: st, extra });
        toast('บันทึกแล้ว'); dlg.close(); selected.clear(); await load();
      } catch (x) { toast(x.message, true); }
    });
  }

  // ---------- รายละเอียด ----------
  function openDetail(id) {
    const r = rows.find(x => x.id === id); if (!r) return;
    const need = docsFor(r.ownership || 'own');
    const editable = me.role === 'env' || ['submitted', 'zone_ok', 'fix'].includes(r.status);
    const body = openDlg(r.id, `
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">${statusBadge(r.status)}<span class="muted">${esc(r.channel)} · ${fmtDate(r.created, true)}</span></div>
      ${stepper(r.status)}
      ${r.fixReason ? `<div class="alert"><b>สิ่งที่ต้องแก้ไข:</b> ${esc(r.fixReason)}</div>` : ''}
      <dl class="kv">
        <dt>ชนิด</dt><dd>${esc(productName(r.product))}</dd>
        <dt>ชื่อ-นามสกุล</dt><dd>${esc(r.name)} · <a href="tel:${esc(r.phone)}">${esc(r.phone)}</a></dd>
        <dt>บัตรประชาชน</dt><dd>${esc(r.citizenId)}</dd>
        <dt>เขต</dt><dd>${esc(r.zone)}</dd>
        <dt>ที่อยู่</dt><dd>${esc(r.address)}</dd>
        <dt>ที่ดินตั้งอยู่</dt><dd>${esc(r.landLocation)}</dd>
        <dt>สิทธิ์ในที่ดิน</dt><dd>${esc((OWNERSHIP.find(o => o.id === r.ownership) || {}).label || '–')}</dd>
        <dt>จำนวน</dt><dd><b>${fmtNum(r.rai, 2)} ไร่ · ${fmtNum(r.tons, 1)} ตัน</b> · ระยะทาง ${esc(r.distanceKm || '–')} กม.</dd>
        <dt>ขนส่ง</dt><dd>${esc(r.transport)} · ${esc(r.truckType || '')} ${esc(r.plate || '')}</dd>
        ${r.note ? `<dt>หมายเหตุ</dt><dd>${esc(r.note)}</dd>` : ''}
      </dl>
      <h3 style="margin-top:18px">เอกสาร (PDF) ${r.folderUrl ? `<a class="btn small" href="${esc(r.folderUrl)}" target="_blank" rel="noopener">📁 เปิดโฟลเดอร์</a>` : ''}</h3>
      <div class="docrow"><div><b>ใบคำร้อง</b><div class="files">${(r.docs.form || []).map(f => f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a>` : `<span class="muted">${esc(f.name)}</span>`).join(' ') || '<span class="muted">– ยังไม่มี</span>'}</div></div>
        <button class="btn small" data-regen>↻ สร้าง PDF ใหม่</button></div>
      ${need.map(d => {
        const fs = r.docs[d.id] || [];
        return `<div class="docrow"><div><b>${esc(d.label)}</b><div class="files">${fs.map((f, i) => f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name || 'ไฟล์ ' + (i + 1))}</a>` : `<span class="muted">${esc(f.name)}</span>`).join(' ') || '<span class="muted">– ยังไม่มี</span>'}</div></div>
          ${FC.docButtons(d.id)}</div>`;
      }).join('')}
      <h3 style="margin-top:18px">ตรวจเอกสาร</h3>
      <form class="checklist" id="chk">${STAFF_CHECKS.map(c => `<label><input type="checkbox" name="${c.id}" ${r.checks && r.checks[c.id] ? 'checked' : ''}> ${esc(c.label)}</label>`).join('')}
        <div class="actions"><button class="btn small">บันทึกการตรวจ</button></div></form>
      <h3 style="margin-top:18px">ดำเนินการ</h3>
      <div class="cta">${actionsFor([r]).map(([st, lbl]) => `<button class="btn ${st === 'fix' ? '' : 'primary'}" data-act="${st}">${esc(lbl)}</button>`).join('')}
        ${editable ? '<button class="btn" data-edit>แก้ไขข้อมูล</button>' : ''}
        ${me.role === 'env' || ['submitted', 'fix', 'zone_ok'].includes(r.status) ? (r.status !== 'cancelled' ? '<button class="btn danger" data-act="cancelled">ยกเลิกคำขอ</button>' : '') : ''}
        <button class="btn" data-paper>🖨 ใบคำร้อง</button><button class="btn" data-print1>🖨 ใบปะหน้า</button></div>
      <details><summary>ประวัติ (${(r.history || []).length})</summary><ul class="timeline">${(r.history || []).slice().reverse().map(h => `<li>${fmtDate(h.t, true)} — ${esc(h.by)}: ${esc(h.a)}</li>`).join('')}</ul></details>`);
    $$('[data-act]', body).forEach(b => (b.onclick = () => askStatus([r.id], b.dataset.act)));
    $('[data-print1]', body).onclick = () => printCover([r]);
    $('[data-paper]', body).onclick = () => FC.printPaper(r);
    $('[data-regen]', body).onclick = async e => {
      e.target.disabled = true; e.target.textContent = 'กำลังสร้าง…';
      if (await FC.uploadFormPdf(r, { pin: me.pin })) { toast('สร้างใบคำร้อง PDF แล้ว'); await load(); openDetail(r.id); }
      else { toast('สร้าง PDF ไม่สำเร็จ', true); e.target.disabled = false; e.target.textContent = '↻ สร้าง PDF ใหม่'; }
    };
    const ed = $('[data-edit]', body);
    if (ed) ed.onclick = () => {
      const host = openDlg('แก้ไข ' + r.id, '<div></div>').firstElementChild;
      FC.renderRequestForm(host, { user: me, initial: r, onCancel: () => openDetail(r.id), onDone: async () => { toast('บันทึกแล้ว'); await load(); openDetail(r.id); } });
    };
    $('#chk').addEventListener('submit', async e => {
      e.preventDefault();
      const checks = {}; $$('input', e.target).forEach(i => (checks[i.name] = i.checked));
      try { await api('checks', { pin: me.pin, id: r.id, checks }); toast('บันทึกการตรวจแล้ว'); await load(); }
      catch (x) { toast(x.message, true); }
    });
    $$('[data-doc]', body).forEach(inp => inp.addEventListener('change', async () => {
      try {
        inp.parentElement.firstChild.textContent = 'กำลังทำ PDF…';
        if (await FC.reviewAndUpload(r.id, { pin: me.pin }, inp.dataset.doc, inp.files, { product: r.product })) {
          toast('แนบไฟล์แล้ว'); await load(); openDetail(r.id);
        } else openDetail(r.id);
      } catch (x) { toast(x.message, true); }
    }));
  }

  $('#addNew').onclick = () => {
    const host = openDlg('คีย์คำขอแทนชาวไร่', '<div></div>').firstElementChild;
    FC.renderRequestForm(host, { user: me, onCancel: () => dlg.close(), onDone: async id => { toast('บันทึกคำขอ ' + id); dlg.close(); await load(); } });
  };

  // ---------- ใบปะหน้าเขต (ตามแบบฟอร์มแผนกสิ่งแวดล้อม) ----------
  function printCover(list) {
    const groups = {};
    list.forEach(r => { const k = r.product + '|' + r.zone; (groups[k] = groups[k] || []).push(r); });
    $('#print').innerHTML = Object.entries(groups).map(([k, g], gi) => {
      const [prod, zone] = k.split('|');
      const box = id => (id === prod ? '☑' : '☐');
      return `<div style="${gi ? 'page-break-before:always' : ''}">
        <h2>${esc(CFG.ORG_NAME)}<br>รายชื่อผู้ขอรับสิ่งปฏิกูลที่ไม่ใช้แล้ว ${box('leaf')} กากใบ ${box('filtercake')} ขี้หม้อกรอง ${box('ash')} ขี้เถ้า ประจำปี ${esc(CFG.SEASON)} — เขต ${esc(zone)}</h2>
        <table><thead><tr><th>ลำดับ</th><th>รายชื่อ</th><th>เบอร์โทร</th><th>จำนวน (ไร่)</th><th>จำนวนที่ยื่นขอ (ตัน)<br>(ตามกฎหมาย)</th><th>ระยะทาง (กม.)</th><th>รถขนส่ง</th><th>หมายเหตุ</th></tr></thead>
        <tbody>${g.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td>${esc(r.phone)}</td><td style="text-align:right">${fmtNum(r.rai, 2)}</td><td style="text-align:right">${fmtNum(r.tons, 1)}</td><td style="text-align:right">${esc(r.distanceKm || '')}</td><td>${esc(r.transport)}</td><td>${esc(r.id)}</td></tr>`).join('')}
        <tr><td></td><td><b>รวม ${g.length} ราย</b></td><td></td><td style="text-align:right"><b>${fmtNum(g.reduce((s, r) => s + num(r.rai), 0), 2)}</b></td><td style="text-align:right"><b>${fmtNum(g.reduce((s, r) => s + num(r.tons), 0), 1)}</b></td><td></td><td></td><td></td></tr></tbody></table></div>`;
    }).join('');
    window.print();
  }

  function exportCsv(list) {
    const cols = FC_FIELDS.filter(([k]) => !['docs', 'checks', 'history'].includes(k));
    // เบอร์/เลขบัตร: ="…" ให้ Excel เก็บเป็นข้อความ (ไม่ตัด 0 นำหน้า ไม่กลายเป็น 3.65E+12)
    // ข้อความที่ขึ้นต้นด้วย = + - @ ใส่ ' นำหน้า กันถูกตีความเป็นสูตร
    const cell = (v, k) => {
      const s = String(v ?? '');
      if (['phone', 'citizenId'].includes(k) && /^\d+$/.test(s)) return '="' + s + '"';
      return '"' + (/^[=+\-@\t\r]/.test(s) ? "'" + s : s).replace(/"/g, '""') + '"';
    };
    const csv = '﻿' + [cols.map(c => cell(c[1])).join(',')].concat(list.map(r => cols.map(([k]) => cell(k === 'product' ? productName(r[k]) : k === 'status' ? (STATUS[r[k]] || {}).short : r[k], k)).join(','))).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `คำขอสิ่งปฏิกูล-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
})();
</script>
